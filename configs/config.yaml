# XRefactor Configuration

# Project Paths
project:
  data_dir: "../Data"
  output_dir: "./outputs"
  model_dir: "./models"
  experiment_dir: "./experiments"

# CPG Configuration
cpg:
  language: "java"  # Supported: java
  include_data_flow: true
  include_control_flow: true
  include_call_graph: true
  max_file_size: 1000000  # bytes
  
# GNN Configuration
gnn:
  model_type: "gat"  # Supported: gat, gcn, graphsage
  hidden_dims: [256, 256]
  output_dim: 128
  num_heads: 8
  dropout: 0.1
  num_layers: 3
  activation: "relu"
  node_embedding_dim: 64
  # Path to weights produced by `python -m src.gnn.pretrain` (see docs). Without this,
  # the node encoder and GNN run with random weights - structurally valid embeddings
  # but not yet meaningful ones.
  # Trained 2026-09-28 via link-prediction pretraining on the full Data/ corpus
  # (21 repos), 40 epochs, loss converged ~0.406. See refactoring_mining/mining_report.json
  # and DEVELOPMENT.md's Known Limitations section for coverage caveats.
  pretrained_checkpoint: "./models/gnn_pretrained.pt"
  # Path to weights produced by refactoring_mining/train_refactoring_predictor.py,
  # trained on real refactorings mined from git history via RefactoringMiner.
  # Without this, refactoring-type/confidence predictions are untrained.
  # Trained 2026-09-28 on 3731 labeled examples (10/10 classes) mined from 4 repos -
  # see refactoring_mining/mining_report.json and models/refactoring_predictor_trained.metrics.json
  # for per-class test-set precision/recall/F1 (some classes remain thin - see DEVELOPMENT.md).
  refactoring_predictor_checkpoint: "./models/refactoring_predictor_trained.pt"
  
# Transformer Configuration
transformer:
  model_type: "microsoft/codebert-base"  # Supported: codebert, graphcodebert
  max_seq_length: 512
  hidden_size: 768
  num_layers: 6
  num_attention_heads: 12
  intermediate_size: 3072
  # Path to weights produced by `python -m src.transformer.train_transformer`.
  # Without this, the decoder is randomly initialized and generation is not meaningful.
  # Trained 2026-09-29 on 1000/2612 available before/after pairs (CPU time budget), 2 epochs,
  # train loss 4.37->2.23. Output moved from incoherent subword garbage (untrained) to
  # repetitive-but-real-vocabulary text - a genuine first pass, not converged. Conditioned
  # on a per-refactoring-type placeholder vector, not real per-example GNN embeddings - see
  # the training script's docstring and models/transformer_trained.metrics.json.
  pretrained_checkpoint: "./models/transformer_trained.pt"
  dropout: 0.1
  
# Training Configuration
training:
  batch_size: 32
  learning_rate: 0.0001
  num_epochs: 100
  warmup_steps: 1000
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.01
  device: "cuda"  # or "cpu"
  
# XAI Configuration
xai:
  method: "causal_inference"  # Supported: causal_inference, attention, shap
  explanation_length: 200  # words
  num_evidence_cards: 3
  confidence_threshold: 0.7
  # Path to weights produced by `python -m src.xai.train_causal_module`. Without
  # this, problem_detector/solution_evaluator are randomly initialized, so
  # evidence-card confidence scores are not meaningful (explanation TEXT stays
  # reasonable regardless - it's template-based, keyed off refactoring_type).
  # Trained 2026-09-29 on weak/proxy supervision (400 problem-detector examples,
  # 672 solution-evaluator examples) from 3 mined repos. problem_detector reached
  # 0.95 val accuracy (real signal: refactoring targets ARE structurally
  # distinctive). solution_evaluator stayed near chance (~0.4-0.6) - the GNN
  # embeddings here are purely structural/type-based with no semantic text
  # content, so many before/after pairs (especially local changes like renames)
  # are close to indistinguishable in this embedding space. See
  # models/causal_module_trained.pt's training log / DEVELOPMENT.md.
  pretrained_checkpoint: "./models/causal_module_trained.pt"
  
# Data Configuration
data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  num_workers: 4
  
# Refactoring Patterns
refactoring:
  patterns:
    - "extract_method"
    - "move_class"
    - "rename_variable"
    - "consolidate_duplicate_code"
    - "remove_dead_code"
  confidence_threshold: 0.8
  max_changes_per_file: 5

# Rule-based code-smell detection (src/cpg/smell_detector.py) - the non-learned
# counterpart to the GNN's predicted refactoring_type. Each threshold is a
# deliberately simple heuristic; see the detector's docstrings for caveats.
smells:
  long_method_statement_threshold: 15
  duplicate_code_min_statements: 3
  duplicate_code_similarity_threshold: 0.7
  complex_condition_branch_threshold: 5
  complex_condition_boolean_op_threshold: 3
  god_class_member_threshold: 20
  high_coupling_file_threshold: 10

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json, text
  output_file: "./outputs/xrefactor.log"
